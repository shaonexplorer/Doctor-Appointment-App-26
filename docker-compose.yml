version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: doctor-appointment-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doctor_appointment
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: doctor-appointment-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Prisma Studio for database visualization
  prisma-studio:
    image: node:20-alpine
    container_name: doctor-appointment-prisma-studio
    working_dir: /app
    command: npx prisma studio --port 5555 --hostname 0.0.0.0
    ports:
      - '5555:5555'
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/doctor_appointment?schema=public'

volumes:
  postgres_data:
  redis_data:
